name: truyencloud

services:
  redis:
    image: redis:7-alpine
    container_name: truyencloud-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: truyencloud-backend
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    develop:
      watch:
        # Sync Backend source code changes and restart application process
        - action: sync+restart
          path: ./backend/src
          target: /app/src
        # Rebuild container image when pom.xml changes
        - action: rebuild
          path: ./backend/pom.xml

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: truyencloud-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_TARGET=http://backend:8080
    develop:
      watch:
        # Hot-reload React components and assets
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        # Rebuild container when dependencies change
        - action: rebuild
          path: ./frontend/package.json
    depends_on:
      - backend

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: truyencloud-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: always

networks:
  default:
    name: truyencloud-network
