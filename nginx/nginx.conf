server {
    listen 80;
    server_name localhost;

    # Tăng dung lượng request tối đa (Tránh lỗi 413 Payload Too Large khi upload ảnh)
    client_max_body_size 50M;

    # 1. Phục vụ Frontend React (File tĩnh đã được build)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Hỗ trợ Client-side Routing của React không bị lỗi 404 khi F5 trang
        try_files $uri $uri/ /index.html;
    }

    # 2. Điều hướng API sang Backend Spring Boot
    location /api/ {
        # 'backend' ở đây là tên service backend khai báo trong docker-compose.yml
        proxy_pass http://backend:8080/api/; 
        proxy_http_version 1.1;

        # Chuyển tiếp các Header quan trọng
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Đảm bảo Cookie HttpOnly (refreshToken) truyền đi mượt mà qua proxy
        proxy_cookie_path / /;
    }
}