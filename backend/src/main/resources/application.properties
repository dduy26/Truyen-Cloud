spring.application.name=demo
spring.data.mongodb.database=cuutruyen_db
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/cuutruyen_db}
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# JWT Configuration
jwt.secret=${JWT_SECRET:HOMNAYTRANGCAOQUAANHMUONHONEMVAOMAMOAMOAMOAMOAMOAMOA}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Ép Console Log hiển thị UTF-8
vaadin.console.utf8=true
logging.charset.console=UTF-8

# CuuTruyen API External Configs
cuutruyen.cdn.url=https://cuutruyen.net
cuutruyen.api.base-url=https://cuutruyen.net/api/v2/

# MangaDex API & Uploads CDN External Configs
mangadex.api.base-url=https://api.mangadex.org/
mangadex.uploads.url=https://uploads.mangadex.org/
