spring.application.name=demo
spring.data.mongodb.database=mangacloud_db
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/mangacloud_db}
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Ép Console Log hiển thị UTF-8
vaadin.console.utf8=true
logging.charset.console=UTF-8

# Otruyen API External Configs
otruyen.cdn.url=https://otruyenapi.com/uploads/comics/
otruyen.api.base-url=https://otruyenapi.com/v1/api/

# MangaDex API & Uploads CDN External Configs
mangadex.api.base-url=https://api.mangadex.org/
mangadex.uploads.url=https://uploads.mangadex.org/
